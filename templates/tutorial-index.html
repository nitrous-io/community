<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Nitrous</title>
    <link rel="stylesheet" type="text/css" href="/css/user.css" />
  </head>
  <body>
    <h1>Tutorials</h1>

      {{range $i, $t := .Tutorials}}
        <a href="/community/tutorial/{{.PrettyURL}}">{{.Title}}</a>
        <div>{{ToHtml $t.PostHTML}}</div>
        <small>By: {{$t.Author}}</small>
        <div>
        Tags:
        {{range $tag := index $.Tags $i}}
          <a href="/community/tags/{{$tag}}">{{$tag}}</a>
        {{end}}
        </div>
      {{end}}

    <br>
    <a href="/community">Home</a>

  </body>
</html>
