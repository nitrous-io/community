<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Nitrous</title>
    <link rel="stylesheet" type="text/css" href="/css/user.css" />
  </head>
  <body>

    {{with .Tutorial}}
      <h1>{{.Title}}</h1>
      <div>{{ToHtml .PostHTML}}</div>
      <small>By: {{.Author}}</small>
    {{end}}

    <div>
    Tags:
    {{range .Tags}}
      <a href="/community/tags/{{.}}">{{.}}</a>
    {{end}}
    </div>

    <br>
    <a href="/community">Home</a>

  </body>
</html>
